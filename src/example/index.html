<body>
<button id="http-response-btn">fetch http</button>
<h3 id="http-response-result"></h3>

<button id="http-secure-response-btn">fetch http secure</button>
<h3 id="http-secure-response-result"></h3>

<script>
    /** @type {Array<{host: string; endpoint: string}>} */
    const arr = [
        { host: 'http://localhost:3001', endpoint: 'http-response' },
        { host: 'https://localhost:3002', endpoint: 'http-secure-response' }
    ];

    arr.forEach((el) => {
        document.getElementById(el.endpoint + '-btn').addEventListener('click', async () => {
            let text;
            try {
                const response = await fetch(`${el.host}/${el.endpoint}`);
                text = await response.text();
            } catch (e) {
                text = e.message;
            }
            document.getElementById(el.endpoint + '-result').innerText = `${el.endpoint}: ${text}`;
            console.log(text);
        });
    });
</script>
</body>
